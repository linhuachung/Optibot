name: Daily scraper

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  AI_PROVIDER: ${{ vars.AI_PROVIDER || 'openai' }}

concurrency:
  group: optibot-daily-state
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Select prior trusted state
        id: prior
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m scripts.actions_state select
      - name: Restore prior state artifact
        if: steps.prior.outputs.found == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.prior.outputs.artifact_id }}
          github-token: ${{ github.token }}
          run-id: ${{ steps.prior.outputs.run_id }}
          path: data
          merge-multiple: true
      - name: Bootstrap first run
        if: steps.prior.outputs.found != 'true'
        env:
          BOOTSTRAP_MANIFEST: ${{ secrets.OPTIBOT_BOOTSTRAP_MANIFEST }}
          BOOTSTRAP_STATE: ${{ secrets.OPTIBOT_BOOTSTRAP_STATE }}
          OPENAI_VECTOR_STORE_ID: ${{ vars.OPENAI_VECTOR_STORE_ID }}
        run: python -m scripts.actions_state bootstrap
      - name: Confirm usable restored state
        id: restored
        run: |
          test -s data/manifest.json
          test -s data/ingestion-state.json
      - name: Prepare Gemini provider state
        if: env.AI_PROVIDER == 'gemini'
        env:
          GEMINI_BOOTSTRAP_STATE: ${{ secrets.GEMINI_BOOTSTRAP_STATE }}
          GEMINI_FILE_SEARCH_STORE: ${{ vars.GEMINI_FILE_SEARCH_STORE }}
        run: python -m scripts.actions_state gemini
      - name: Build job container
        run: docker build -t harbor-ledger .
      - name: Run once and exit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FILE_SEARCH_STORE: ${{ vars.GEMINI_FILE_SEARCH_STORE }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_VECTOR_STORE_ID: ${{ vars.OPENAI_VECTOR_STORE_ID }}
        run: |
          docker run --rm --env AI_PROVIDER --env GEMINI_API_KEY --env GEMINI_FILE_SEARCH_STORE --env GEMINI_MODEL --env OPENAI_API_KEY --env OPENAI_VECTOR_STORE_ID --mount "type=bind,source=$PWD/data,target=/data" harbor-ledger
      - name: Preserve state and last-run evidence even after failure
        if: always() && steps.restored.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: optibot-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            data/manifest.json
            data/ingestion-state.json
            data/gemini-state.json
            data/gemini-migration.json
            data/last-run.json
          if-no-files-found: error
          retention-days: 90
